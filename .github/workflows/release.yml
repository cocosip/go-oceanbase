name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURR_TAG=${GITHUB_REF#refs/tags/}
          {
            echo "## What's Changed"
            echo
            git log "${PREV_TAG}..HEAD" --pretty=tformat:"- %s" --no-merges
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}"
          } > CHANGELOG_BODY.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: false
