name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Run integration tests against explicitly configured test databases'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.25.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version
      - run: go list -deps ./...
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go test -race ./... -count=1
        if: runner.os == 'Linux'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  protocol-boundaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test ./... -count=1
        env:
          GOARCH: '386'
      - run: go test ./internal/wire -run '^$' -fuzz FuzzPacket -fuzztime 30s -parallel 2
      - run: go test ./internal/wire -run '^$' -fuzz FuzzHandshake -fuzztime 30s -parallel 2
      - run: go test ./internal/wire -run '^$' -fuzz FuzzText -fuzztime 30s -parallel 2
      - run: go test ./internal/wire -run '^$' -fuzz FuzzStmt -fuzztime 30s -parallel 2
      - run: go test . -run '^$' -fuzz FuzzBindPlan -fuzztime 30s -parallel 2
      - run: go test . -run '^$' -fuzz FuzzClientPrepare -fuzztime 30s -parallel 2
      - run: go test . -run '^$' -fuzz FuzzJDBCEscapes -fuzztime 30s -parallel 2
      - run: go test . -run '^$' -fuzz FuzzScalars -fuzztime 30s -parallel 2
      - run: go test . -run '^$' -fuzz FuzzMetadataFilters -fuzztime 30s -parallel 2
      - run: go test ./internal/charset -run '^$' -fuzz FuzzCharset -fuzztime 30s -parallel 2

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
        profile: [mysql, oracle, proxy-mysql, proxy-oracle]
    env:
      OB_TEST_REQUIRE: '1'
      OB_TEST_PROFILE: ${{ matrix.profile }}
      OB_MYSQL_DSN: ${{ secrets.OB_MYSQL_DSN }}
      OB_ORACLE_DSN: ${{ secrets.OB_ORACLE_DSN }}
      OBPROXY_MYSQL_DSN: ${{ secrets.OBPROXY_MYSQL_DSN }}
      OBPROXY_ORACLE_DSN: ${{ secrets.OBPROXY_ORACLE_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -tags=integration ./tests/integration -run 'Test(Smoke|QueryCRUD|QueryResults|PrepareRoundTrip|PrepareEquivalence|LocalTx|StmtAfterReset|MultiResult|AllScalarTypes|MetadataCatalog)$' -count=1
