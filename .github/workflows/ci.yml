name: CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Unit tests
        shell: bash
        run: go test ${{ matrix.os == 'ubuntu-latest' && '-coverprofile=coverage.out -covermode=atomic' || '' }} ./... -count=1 -timeout 5m
      - name: Build packages and examples
        if: matrix.os == 'ubuntu-latest'
        run: go build ./...
      - name: Compile integration tests without a database
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags=integration ./... -run '^$' -timeout 1m
      - name: Compile platform-specific authentication and proxy code
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -tags gssapi ./...
          go vet -tags "gssapi,gssapitest,obproxy,obproxytest" ./...
          go test -tags="gssapitest,obproxytest" ./... -run '^$' -timeout 2m
      - name: Upload coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Check formatting and module files
        shell: bash
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
          go mod tidy -diff
      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags=integration --timeout=10m

  benchmark:
    name: Benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run protocol-peer benchmarks without a database
        shell: bash
        run: go test . ./internal/wire -run '^$' -bench . -benchmem -timeout 5m > benchmark-results.txt
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
